# 레이더 설정. 프로토콜 값은 radar/ld2450.py·ld2410c.py에 공식 문서 기준으로 있음 (둘 다 256000 baud).
# 포트 이름 확인: python -m radar.monitor --list

ld2450:
  port: /dev/cu.usbserial-0001   # CP2102. 이 이름이 없으면 adapter 칩으로 자동으로 찾음
  adapter: cp2102
  baud: 256000                   # CP2102는 공식 값 그대로 정상 (2026-11-12, 2370프레임 중 깨진 것 0)
  # X값의 방향: 공식 문서에 없어 실측으로 확인 (2026-11-12, 레이더 앞면이 방을 보게 세우고 긴 쪽을 가로로)
  # 레이더가 바라보는 방향에서 오른쪽으로 걸으면 X가 작아짐 → X > 0 = 레이더 기준 왼쪽
  x_positive: left
  max_range_m: 3.75              # 이보다 먼 대상은 버림 (2026-11-12, 방 밖·옆방 오감지 줄이기. LD2410C 5칸과 같게)

ld2410c:
  port: /dev/cu.usbserial-210    # CH340. 꽂는 USB 단자에 따라 이름이 바뀜 (-210, -10 …) → 없으면 adapter 칩으로 자동으로 찾음
  adapter: ch340
  # 레이더는 공식 값 256000으로 보내지만, 이 CH340 어댑터는 macOS 드라이버에서 256000을 요청하면 실제 속도가 어긋나
  # 바이트 최상위 비트가 깨짐 (0d→8d). 2026-11-12 실측: 262000~280000 요청 시 깨진 프레임 0 → 가운데 값 사용.
  # 어댑터를 바꾸면 다시 확인할 것 (CP2102면 256000)
  baud: 270000
  # 레이더 내부 설정 (전원을 꺼도 유지). 바꾸기: python -m radar.ld2410c_config --max-gate N
  # 2026-11-12: 공장 기본 8칸(6.0m) → 5칸(3.75m)으로 줄임 (먼 곳·옆방 오감지 줄이기. LD2450 3.75m와 같게)
  max_gate: 5
  # 엔지니어링 모드: 거리 칸(0.75m)별 움직임·정지 에너지를 함께 보고 (공식 문서 2.2.5, 명령 0x0062).
  # 전원이 꺼지면 꺼지므로 Node가 켜질 때마다 켬. 침대 칸에 누운 사람이 남아 있는지 판단에 씀 (fusion/fuse.py)
  engineering: true

installation:
  # 레이더(LD2450)를 방 어디에 어느 방향으로 설치했는지. 좌표 기준 (2026-11-12 확정, 이효창에게 전달):
  #   평면도를 위에서 본 2D, 미터. 원점 = 평면도에서 방의 왼쪽 아래 모서리, x = 오른쪽, y = 위쪽
  # 값이 없으면 위치(position)는 null로 보냄 (지어내지 않음, R-09)
  # 2026-11-19 시연 공간 설치 (실제 침실이 아닌 공간을 평면도 방1로 가정). 노트북(레이더)을 누울 자리 쪽으로 옮긴 뒤 다시 잼:
  #   LD2450으로 잰 두 점을 평면도 방1에 맞춰 레이더 위치·방향을 거꾸로 계산
  #   - 문 안쪽: 레이더 오른쪽 29°, 1.47m (오른쪽 0.72m·앞 1.28m) → 평면도 (0.30, 1.08) = 평면도 문에 정확히 맞춤
  #   - 누운 자리: 레이더 왼쪽 29°, 2.24m (왼쪽 1.10m·앞 1.96m) → 평면도 (1.85, 2.25) = 평면도 침대 위
  #     (실제 문–누운 자리 1.94m < 평면도 2.64m라 둘 다 맞출 수는 없음 → 문 우선, 방향은 평면도 침대 쪽으로)
  #   처음 자리(누운 자리 3.0~3.7m, 시야 끝)에서는 누운 사람의 대표 점이 1m 가까이 흔들려 방 밖·범위 밖으로 빠졌고
  #   LD2410C도 누운 사람을 87~94% 놓침 → 가까이 옮긴 뒤 LD2410C 누운 사람 100% "정지한 사람 있음"
  #   레이더나 노트북을 옮기면 다시 잴 것
  radar_x: -0.40
  radar_y: 2.37
  facing_deg: 327.7         # 레이더 앞면이 보는 방향. 0 = 평면도 오른쪽(+x), 90 = 위(+y), 반시계 방향
  room_width_m: 4.2         # 방의 x 방향 크기 (평면도 방1). 방 밖(여유 0.3m)으로 계산되는 대상은 버림
  room_depth_m: 3.4         # 방의 y 방향 크기
  # 문 안쪽 위치 (방 좌표, 2026-11-19 LD2450으로 잼). 누워 있던 사람은 "나간 흔적"(방 안쪽에서 처음 잡힌 움직이는 사람이
  # 문 근처 1m 안에서 사라짐)이 있어야 나간 것으로 봄. 문 근처에서 나타났다 사라진 사람은 지나간 사람 (fusion/fuse.py)
  door_x: 0.30
  door_y: 1.08

motion:
  # 움직임 정도 (2026-11-12 실측, LD2410C 움직임 에너지 중간값: 가만히 0, 뒤척임 18, 서서 흔들림 32, 걷기 100)
  window_seconds: 3         # 최근 이 시간의 중간값으로 판단 (순간 흔들림 무시). 위치도 같은 시간의 중간값
  still_below: 15           # 움직임 에너지가 이보다 작으면 STILL
  active_from: 60           # 이 이상이면 ACTIVE (그 사이는 SLIGHT)
  active_speed_cms: 30      # LD2450 속도가 이 이상이어도 ACTIVE (걷기)
  slight_speed_cms: 8       # LD2410C가 없을 때만: LD2450 속도가 이 이상이면 SLIGHT
  stale_seconds: 2          # 레이더 값이 이 시간 넘게 안 오면 그 레이더는 없는 것으로 봄 (UNKNOWN)
  # 침대 칸 = 카메라가 누운 자세를 볼 때 LD2450 거리 / 0.75m 반올림 (LD2410C 칸 n은 n × 0.75m 근처)
  # 침대 칸 정지 에너지의 bed_gate_seconds 중간값이 bed_still_min 이상이면 "침대에 사람 있음" (LD2410C 엔지니어링 모드)
  # 2026-11-19 시연 공간 실측 (침대 2.24m → 3번 칸, 10초 중간값): 누움 8~25, 빈 방 3~5.
  #   3.0m·3.75m 칸은 빈 방에서도 18~88 (벽·창 반사로 보임) → 침대가 그 거리면 쓸 수 없음
  #   다른 사람이 걷는 동안은 모든 칸 100. 노트북 옆(0.3m)에 사람이 있어도 모든 칸 100
  #   측정 두 번뿐이라 여유가 작음 → 더 재서 조정할 것
  bed_still_min: 8
  bed_gate_seconds: 10
