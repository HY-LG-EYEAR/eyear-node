# 레이더 설정. 프로토콜 값은 radar/ld2450.py·ld2410c.py에 공식 문서 기준으로 있음 (둘 다 256000 baud).
# 포트 이름 확인: python -m radar.monitor --list

ld2450:
  port: /dev/cu.usbserial-0001   # CP2102
  baud: 256000                   # CP2102는 공식 값 그대로 정상 (2026-11-12, 2370프레임 중 깨진 것 0)
  # X값의 방향: 공식 문서에 없어 실측으로 확인 (2026-11-12, 레이더 앞면이 방을 보게 세우고 긴 쪽을 가로로)
  # 레이더가 바라보는 방향에서 오른쪽으로 걸으면 X가 작아짐 → X > 0 = 레이더 기준 왼쪽
  x_positive: left
  max_range_m: 3.75              # 이보다 먼 대상은 버림 (2026-11-12, 방 밖·옆방 오감지 줄이기. LD2410C 5칸과 같게)

ld2410c:
  port: /dev/cu.usbserial-210    # CH340
  # 레이더는 공식 값 256000으로 보내지만, 이 CH340 어댑터는 macOS 드라이버에서 256000을 요청하면 실제 속도가 어긋나
  # 바이트 최상위 비트가 깨짐 (0d→8d). 2026-11-12 실측: 262000~280000 요청 시 깨진 프레임 0 → 가운데 값 사용.
  # 어댑터를 바꾸면 다시 확인할 것 (CP2102면 256000)
  baud: 270000
  # 레이더 내부 설정 (전원을 꺼도 유지). 바꾸기: python -m radar.ld2410c_config --max-gate N
  # 2026-11-12: 공장 기본 8칸(6.0m) → 5칸(3.75m)으로 줄임 (먼 곳·옆방 오감지 줄이기. LD2450 3.75m와 같게)
  max_gate: 5

installation:
  # 레이더(LD2450)를 방 어디에 어느 방향으로 설치했는지. 좌표 기준 (2026-11-12 확정, 이효창에게 전달):
  #   평면도를 위에서 본 2D, 미터. 원점 = 평면도에서 방의 왼쪽 아래 모서리, x = 오른쪽, y = 위쪽
  # 값이 없으면 위치(position)는 null로 보냄 (지어내지 않음, R-09). 시연 설치(단계 7) 때 재서 넣을 것
  radar_x: null
  radar_y: null
  facing_deg: null          # 레이더 앞면이 보는 방향. 0 = 평면도 오른쪽(+x), 90 = 위(+y), 반시계 방향
  room_width_m: null        # 방의 x 방향 크기. room_width_m·room_depth_m이 있으면 방 밖으로 계산되는 대상은 버림 (벽 너머)
  room_depth_m: null        # 방의 y 방향 크기

motion:
  # 움직임 정도 (2026-11-12 실측, LD2410C 움직임 에너지 중간값: 가만히 0, 뒤척임 18, 서서 흔들림 32, 걷기 100)
  window_seconds: 3         # 최근 이 시간의 중간값으로 판단 (순간 흔들림 무시). 위치도 같은 시간의 중간값
  still_below: 15           # 움직임 에너지가 이보다 작으면 STILL
  active_from: 60           # 이 이상이면 ACTIVE (그 사이는 SLIGHT)
  active_speed_cms: 30      # LD2450 속도가 이 이상이어도 ACTIVE (걷기)
  slight_speed_cms: 8       # LD2410C가 없을 때만: LD2450 속도가 이 이상이면 SLIGHT
  stale_seconds: 2          # 레이더 값이 이 시간 넘게 안 오면 그 레이더는 없는 것으로 봄 (UNKNOWN)
