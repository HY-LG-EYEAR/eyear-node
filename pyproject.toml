[project]
name = "eyear-node"
version = "0.1.0"
description = "EYEAR Node: 방 단위 센서 장치 소프트웨어"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "paho-mqtt>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]
# 카메라 처리. mediapipe 1.x는 예전 mp.solutions가 없고 Tasks API만 있음
vision = [
    "numpy>=2",
    "opencv-python>=5.0",
    "mediapipe>=1.2",
    "insightface>=2.1",
    "onnxruntime>=1.31",
]
# 마이크·음성 인식
audio = [
    "sounddevice>=0.5",
    "webrtcvad-wheels>=2.0",
    "faster-whisper>=1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["schema*", "publisher*", "vision*", "audio*", "radar*", "fusion*", "recorder*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 실제 모델을 쓰는 느린 테스트는 기본으로 건너뜀: pytest -m slow 로 실행
addopts = "-m 'not slow'"
markers = ["slow: 실제 모델을 불러오는 느린 테스트"]
