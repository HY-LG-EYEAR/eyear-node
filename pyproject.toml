[project]
name = "eyear-node"
version = "0.1.0"
description = "EYEAR Node: 방 단위 센서 장치 소프트웨어"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "paho-mqtt>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]
# 카메라 처리. mediapipe 1.x는 예전 mp.solutions가 없고 Tasks API만 있음
vision = [
    "numpy>=2",
    "opencv-python>=5.0",
    "mediapipe>=1.2",
    "insightface>=2.1",
    "onnxruntime>=1.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["schema*", "publisher*", "vision*", "audio*", "radar*", "fusion*", "recorder*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
